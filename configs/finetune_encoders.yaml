# ═══════════════════════════════════════════════════════════════════════════
#  Encoder Finetuning Config  (LoRA + Contrastive Loss on Raw Frames)
#
#  Usage:
#    python scripts/finetune_encoders.py -c configs/finetune_encoders.yaml
# ═══════════════════════════════════════════════════════════════════════════

# ── Data (raw video frames) ──────────────────────────────────────────────
anno_root: ./preprocess/Phoenix14TCompressed
video_root: /kaggle/input/datasets/mariusschmidtmengin/phoenixweather2014t-3rd-attempt/videos_phoenix/videos
max_frames: 64                               # Max frames per video (uniformly sub-sampled)

# ── Encoder Models ────────────────────────────────────────────────────────
vit_model_name: openai/clip-vit-large-patch14
mae_model_name: MCG-NJU/videomae-large
text_model_name: openai/clip-vit-large-patch14

# ── Feature Dimensions ───────────────────────────────────────────────────
spatial_input_dim: 2048       # ViT + s2wrapping = 1024 * 2
temporal_input_dim: 1024      # VideoMAE hidden size
proj_dim: 512                 # Shared contrastive embedding space

# ── ViT Feature Extraction ──────────────────────────────────────────────
s2_mode: "s2wrapping"         # Multi-scale feature extraction
scales: [1, 2]                # Scales for s2wrapping
vit_nth_layer: -1             # Which hidden layer to use (-1 = last)

# ── MAE Feature Extraction ──────────────────────────────────────────────
mae_nth_layer: -1             # Which hidden layer to use
mae_overlap_size: 8           # Sliding window overlap for 16-frame clips

# ── LoRA Parameters ──────────────────────────────────────────────────────
lora_r: 16                    # LoRA rank
lora_alpha: 32                # LoRA scaling factor
lora_dropout: 0.1             # LoRA dropout

# ── Contrastive Loss ─────────────────────────────────────────────────────
temperature: 0.07             # NT-Xent temperature
cross_modal_weight: 1.0       # Weight for spatial ↔ temporal alignment
visual_text_weight: 0.5       # Weight for visual ↔ text alignment
use_text_loss: true           # Enable visual-text contrastive loss

# ── Optimizer ─────────────────────────────────────────────────────────────
lr: 1.0e-4                    # Learning rate
weight_decay: 0.01            # AdamW weight decay
warmup_ratio: 0.1             # % of total steps used for warmup

# ── Training ─────────────────────────────────────────────────────────────
batch_size: 4                 # Smaller batch (raw frames are memory-heavy)
num_workers: 4
max_epochs: 2
devices: 1
accumulate_grad_batches: 8    # Effective batch = 4 * 8 = 32
precision: bf16-mixed
gradient_clip_val: 1.0
patience: 10                  # EarlyStopping patience (epochs)
seed: 42

# ── Logging ──────────────────────────────────────────────────────────────
log_dir: logs/encoder_finetune
cache_dir: /data3/models
# save_dir: null              # Defaults to <log_dir>/lora_weights
verbose: true
