# ═══════════════════════════════════════════════════════════════════════════
#  VideoMAE Finetuning with LoRA — Configuration
# ═══════════════════════════════════════════════════════════════════════════
#
#  Usage:  python scripts/finetune_mae.py -c configs/finetune_mae.yaml
#
# ═══════════════════════════════════════════════════════════════════════════

# ── Data (raw video frames) ──────────────────────────────────────────────
anno_root: ./preprocess/Phoenix14TCompressed
video_root: /kaggle/input/datasets/mariusschmidtmengin/phoenixweather2014t-3rd-attempt/videos_phoenix/videos
max_frames: 16

# ── Model ────────────────────────────────────────────────────────────────
mae_model_name: MCG-NJU/videomae-large
text_model_name: openai/clip-vit-large-patch14

# ── Feature Dimensions ───────────────────────────────────────────────────
temporal_input_dim: 1024      # VideoMAE hidden size
proj_dim: 512                 # Shared contrastive embedding space

# ── MAE Extraction Settings ─────────────────────────────────────────────
mae_nth_layer: -1
mae_overlap_size: 8

# ── LoRA ─────────────────────────────────────────────────────────────────
lora_r: 16
lora_alpha: 32
lora_dropout: 0.1

# ── Loss ─────────────────────────────────────────────────────────────────
temperature: 0.07

# ── Optimiser ────────────────────────────────────────────────────────────
lr: 0.0001
weight_decay: 0.01
warmup_ratio: 0.1

# ── Training ─────────────────────────────────────────────────────────────
batch_size: 2
num_workers: 4
max_epochs: 12
devices: 2
accumulate_grad_batches: 4
precision: 16
gradient_clip_val: 1.0
patience: 10
seed: 42

# ── Paths ────────────────────────────────────────────────────────────────
log_dir: logs/finetune_mae
cache_dir: /data3/models
verbose: false
