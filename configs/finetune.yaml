model:
  target: spamo.t5_slt.FlanT5SLT
  params:
    lr: 6.0e-4
    monitor: val/bleu4

    model_name: google/flan-t5-base
    cache_dir: /home/omar_bishr/spamo_workspace/huggingface_cache

    inter_hidden: 1024
    input_size: 2048
    emotion_input_size: 768
    beam_size: 5
    max_frame_len: 512
    max_txt_len: 128
    frame_sample_rate: 1
    prompt: "Translate the given sentence into {}."

    tuning_type: lora

    use_spatial: true
    use_spatiotemporal: true
    use_emotion: true

    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.1
    weight_decay: 0.01

    fusion_mode: joint
    warm_up_steps: null
    cross_modal_align: true
    combined_loss: true

    alpha: 1.0

    use_in_context: false
    num_in_context: 0

    conv_type: 2

    use_dynamic_segmentation: false
    motion_threshold: 0.8
    use_adaptive_masking: true
    mask_prob: 0.45
    min_mask_len: 5
    max_mask_len: 20
    num_layers: 5
    mask_type: 'noise'

lightning:
  callback:
    learning_rate_logger:
      target: pytorch_lightning.callbacks.LearningRateMonitor
      params:
        logging_interval: step
    timer:
      target: pytorch_lightning.callbacks.Timer
      params:
        duration: "00:10:00:00"
  trainer:
    accumulate_grad_batches: 1
    accelerator: gpu
    devices: 1
    max_epochs: 500
    gradient_clip_val: 1.0
    check_val_every_n_epoch: 1
    precision: 32

data:
  target: dataset.datamodule.DataModuleFromConfig
  params:
    batch_size: 16
    num_workers: 4
  
    train:
      target: dataset.p14t.Phoenix14T
      params:
        anno_root: /home/omar_bishr/spamo_workspace/SpaMo_clean/preprocess/Phoenix14T
        vid_root: ./dataset/Phoenix14T
        feat_root: /home/omar_bishr/spamo_workspace/phoenix/feat_Phoenix14T
        mae_feat_root: /home/omar_bishr/spamo_workspace/phoenix/mae_feat_Phoenix14T
        emo_feat_root: /home/omar_bishr/spamo_workspace/phoenix/emotion_features
        mode: train
        spatial: true
        spatiotemporal: true
        emotion: true
        spatial_postfix: ""
        spatiotemporal_postfix: ""
        emotion_postfix: "_Ze"
        
    validation:
      target: dataset.p14t.Phoenix14T
      params:
        anno_root: /home/omar_bishr/spamo_workspace/SpaMo_clean/preprocess/Phoenix14T
        vid_root: ./dataset/Phoenix14T
        feat_root: /home/omar_bishr/spamo_workspace/phoenix/feat_Phoenix14T
        mae_feat_root: /home/omar_bishr/spamo_workspace/phoenix/mae_feat_Phoenix14T
        emo_feat_root: /home/omar_bishr/spamo_workspace/phoenix/emotion_features
        mode: dev
        spatial: true
        spatiotemporal: true
        emotion: true
        spatial_postfix: ""
        spatiotemporal_postfix: ""
        emotion_postfix: "_Ze"
    
    test:
      target: dataset.p14t.Phoenix14T
      params:
        anno_root: /home/omar_bishr/spamo_workspace/SpaMo_clean/preprocess/Phoenix14T
        vid_root: ./dataset/Phoenix14T
        feat_root: /home/omar_bishr/spamo_workspace/phoenix/feat_Phoenix14T
        mae_feat_root: /home/omar_bishr/spamo_workspace/phoenix/mae_feat_Phoenix14T
        emo_feat_root: /home/omar_bishr/spamo_workspace/phoenix/emotion_features
        mode: test
        spatial: true
        spatiotemporal: true
        emotion: true
        spatial_postfix: ""
        spatiotemporal_postfix: ""
        emotion_postfix: "_Ze"