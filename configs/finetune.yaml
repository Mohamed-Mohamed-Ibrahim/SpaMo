model:
  target: spamo.t5_slt.FlanT5SLT
  params:
    lr: 6.0e-4
    monitor: val/bleu4

    model_name: google/flan-t5-base
    cache_dir: /data3/models

    inter_hidden: 1024
    input_size: 2048
    emotion_input_size: 768
    beam_size: 5
    max_frame_len: 512
    max_txt_len: 128
    frame_sample_rate: 1
    prompt: "Task: Translate sign language visual features into text.\nDomain: German weather forecast.\nConstraints: Accurately map exact geographical regions, temperatures, and temporal markers. Do not hallucinate external entities.\nTranslate into {}:"

    tuning_type: lora

    use_spatial: true
    use_spatiotemporal: true
    use_pose: false
    use_emotion: true

    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.1
    weight_decay: 0.01

    fusion_mode: joint
    warm_up_steps: null
    cross_modal_align: true
    combined_loss: true

    alpha: 1.0

    sign_cl_loss: false
    sign_cl_alpha: 0.1
    sign_cl_temperature: 0.3
    sign_cl_temporal_window: 12
    sign_cl_every_n_steps: 1

    use_in_context: false
    num_in_context: 0

    use_data_augmentation: true
    augmentation_prob: 0.5
    aug_frame_prob: 0.15
    aug_span_prob: 0.0
    aug_channel_prob: 0.0

lightning:
  callback:
    learning_rate_logger:
      target: pytorch_lightning.callbacks.LearningRateMonitor
      params:
        logging_interval: step
    timer:
        target: pytorch_lightning.callbacks.Timer
        params:
          duration: "00:10:00:00"
  trainer:
    strategy: ddp
    accumulate_grad_batches: 1
    accelerator: gpu
    devices: 2
    max_epochs: 500
    gradient_clip_val: 1.0
    check_val_every_n_epoch: 1
    precision: 32

data:
  target: dataset.datamodule.DataModuleFromConfig
  params:
    batch_size: 8
    num_workers: 4
  
    train:
      target: dataset.p14t.Phoenix14T
      params:
        anno_root: ./preprocess/Phoenix14T
        vid_root: ./dataset/Phoenix14T
        feat_root: feat_Phoenix14T
        mae_feat_root: mae_feat_Phoenix14T
        pose_root: ""
        emo_feat_root: "/kaggle/input/notebooks/muhammad5286/emotion-feature-extraction/emotion_features"
        mode: train
        spatial: true
        spatiotemporal: true
        pose: false
        emotion: true            
        spatial_postfix: ""
        spatiotemporal_postfix: ""
        pose_postfix: ""
        emotion_postfix: "_Ze"   
        
    validation:
      target: dataset.p14t.Phoenix14T
      params:
        anno_root: ./preprocess/Phoenix14T
        vid_root: ./dataset/Phoenix14T
        feat_root: feat_Phoenix14T
        mae_feat_root: mae_feat_Phoenix14T
        pose_root: ""
        emo_feat_root: "/kaggle/input/notebooks/muhammad5286/emotion-feature-extraction/emotion_features"
        mode: dev
        spatial: true
        spatiotemporal: true
        pose: false
        emotion: true            
        spatial_postfix: ""
        spatiotemporal_postfix: ""
        pose_postfix: ""
        emotion_postfix: "_Ze"   
    
    test:
      target: dataset.p14t.Phoenix14T
      params:
        anno_root: ./preprocess/Phoenix14T
        vid_root: ./dataset/Phoenix14T
        feat_root: feat_Phoenix14T
        mae_feat_root: mae_feat_Phoenix14T
        pose_root: ""
        emo_feat_root: "/kaggle/input/notebooks/muhammad5286/emotion-feature-extraction/emotion_features"
        mode: test
        spatial: true
        spatiotemporal: true
        pose: false
        emotion: true            
        spatial_postfix: ""
        spatiotemporal_postfix: ""
        pose_postfix: ""
        emotion_postfix: "_Ze"
