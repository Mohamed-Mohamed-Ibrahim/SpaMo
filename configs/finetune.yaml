model:
  target: spamo.t5_slt.FlanT5SLT
  params:
    lr: 3.0e-4
    monitor: val/bleu4

    model_name: google/flan-t5-large
    cache_dir: /data3/models

    inter_hidden: 1024
    input_size: 2048
    beam_size: 5
    max_frame_len: 512
    max_txt_len: 128
    frame_sample_rate: 1
    prompt: "Translate the given sentence into {}."

    tuning_type: lora

    use_spatial: true
    use_spatiotemporal: true
    use_pose: false

    # Reduce model capacity
    lora_r: 32
    lora_alpha: 64

    # Increase regularization
    lora_dropout: 0.05
    weight_decay: 0.05

    fusion_mode: joint
    warm_up_steps: 1000
    cross_modal_align: true
    combined_loss: true

    alpha: 1.0

    sign_cl_loss: false
    sign_cl_alpha: 0.1
    sign_cl_temperature: 0.3
    sign_cl_temporal_window: 12
    sign_cl_every_n_steps: 1

    # Spatial <-> Spatiotemporal contrastive loss (computed BEFORE feature merging)
    # Aligns the two streams (spatial: ~100-300 frames, spatiotemporal: ~20-50 clips)
    # via one of five strategies, then applies a symmetric CLIP loss.
    st_cl_loss: true
    st_cl_alpha: 1          # weight of this loss in the total loss

    # alignment_mode – how to make the two streams comparable before computing similarity:
    #   padding        – zero-pad the shorter stream to match the longer one, then mean-pool
    #   interp_nearest – 1-D nearest-neighbour interpolation to the same length, then mean-pool
    #   interp_linear  – 1-D linear interpolation to the same length, then mean-pool
    #   reduction      – independently mean-pool each stream (simplest, no length alignment)
    #   attention      – cross-attention: spatiotemporal queries attend over spatial keys/values
    st_cl_alignment_mode: "reduction"

    # st_cl_proj_dim: shared projection dim before similarity (0 = no projection, use inter_hidden)
    st_cl_proj_dim: 0

    # attention-mode specific (ignored for other modes)
    st_cl_num_heads: 4        # number of attention heads
    st_cl_attn_dropout: 0.0   # dropout in cross-attention

    # learnable log-temperature initialisation (CLIP default ≈ 2.6592 = ln(14))
    st_cl_temperature_init: 2.6592

    use_in_context: false
    num_in_context: 0
    # NEW AUGMENTATION PARAMETERS
    use_data_augmentation: false

    augmentation_prob: 0.5       # Apply augmentation to 50% of batches
    aug_frame_prob: 0.1          # Drop 10% of frames
    aug_span_prob: 0.1           # Mask 10% of spans
    aug_channel_prob: 0.05       # Drop 5% of feature channels
    # # Stronger augmentation
    # use_data_augmentation: true
    # augmentation_prob: 0.7
    # aug_frame_prob: 0.15
    # aug_span_prob: 0.2
    # aug_channel_prob: 0.1

lightning:
  callback:
    learning_rate_logger:
      target: pytorch_lightning.callbacks.LearningRateMonitor
      params:
        logging_interval: step
  trainer:
    strategy: ddp
    accumulate_grad_batches: 4
    accelerator: gpu
    devices: 2
    max_epochs: 200
    gradient_clip_val: 1.0
    check_val_every_n_epoch: 1
    precision: 32

data:
  target: dataset.datamodule.DataModuleFromConfig
  params:
    batch_size: 8
    num_workers: 4
  
    train:
      target: dataset.p14t.Phoenix14T
      params:
        anno_root: ./preprocess/Phoenix14T
        vid_root: ./dataset/Phoenix14T
        feat_root: /kaggle/input/datasets/mohamedmoibrahim/spamo-phoenix14tcompressed-spatial-motion-features/phoenix14tcompressed_spatial_features
        mae_feat_root: /kaggle/input/datasets/mohamedmoibrahim/spamo-phoenix14tcompressed-spatial-motion-features/phoenix14tcompressed_motion_features
        pose_root: /kaggle/input/datasets/muhammad5286/phoenix14t-holistic-features/phoenix14t-holistic-features
        mode: train
        spatial: true
        spatiotemporal: true
        pose: false
        spatial_postfix: "_None_s2wrapping"
        spatiotemporal_postfix: "_None_overlap-8"
        pose_postfix: ""
        
    validation:
      target: dataset.p14t.Phoenix14T
      params:
        anno_root: ./preprocess/Phoenix14T
        vid_root: ./dataset/Phoenix14T
        feat_root: /kaggle/input/datasets/mohamedmoibrahim/spamo-phoenix14tcompressed-spatial-motion-features/phoenix14tcompressed_spatial_features
        mae_feat_root: /kaggle/input/datasets/mohamedmoibrahim/spamo-phoenix14tcompressed-spatial-motion-features/phoenix14tcompressed_motion_features
        pose_root: /kaggle/input/datasets/muhammad5286/phoenix14t-holistic-features/phoenix14t-holistic-features
        mode: dev
        spatial: true
        spatiotemporal: true
        pose: false
        spatial_postfix: "_None_s2wrapping"
        spatiotemporal_postfix: "_None_overlap-8"
        pose_postfix: ""
    
    test:
      target: dataset.p14t.Phoenix14T
      params:
        anno_root: ./preprocess/Phoenix14T
        vid_root: ./dataset/Phoenix14T
        feat_root: /kaggle/input/datasets/mohamedmoibrahim/spamo-phoenix14tcompressed-spatial-motion-features/phoenix14tcompressed_spatial_features
        mae_feat_root: /kaggle/input/datasets/mohamedmoibrahim/spamo-phoenix14tcompressed-spatial-motion-features/phoenix14tcompressed_motion_features
        pose_root: /kaggle/input/datasets/muhammad5286/phoenix14t-holistic-features/phoenix14t-holistic-features
        mode: test
        spatial: true
        spatiotemporal: true
        pose: false
        spatial_postfix: "_None_s2wrapping"
        spatiotemporal_postfix: "_None_overlap-8"
        pose_postfix: ""
