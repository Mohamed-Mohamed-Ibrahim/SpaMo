model:
  target: spamo.t5_slt.FlanT5SLT
  params:

    lr: 6.0e-4
    min_lr: 5.0e-5
    monitor: val/bleu4
    model_name: google/flan-t5-xl
    cache_dir: /home/omar_bishr/spamo_workspace/huggingface_cache

    inter_hidden: 1024

    #inter_hidden: 768
    input_size: 2048
    beam_size: 5
    max_frame_len: 512
    max_txt_len: 128
    frame_sample_rate: 1
    prompt: "Translate the given sentence into {}."

    tuning_type: lora

    # Reduce model capacity
    lora_r: 32
    lora_alpha: 64



    # Increase regularization
    lora_dropout: 0.05
    weight_decay: 0.01

    fusion_mode: joint

    warm_up_steps: 4000
    lr_warmup_steps: 10000

    cross_modal_align: true
    combined_loss: true

    alpha: 1.0

    sign_cl_loss: false
    sign_cl_alpha: 0.1
    sign_cl_temperature: 0.3
    sign_cl_temporal_window: 12
    sign_cl_every_n_steps: 1

    use_in_context: false
    num_in_context: 0
    
    use_gradient_checkpointing: true

    # NEW AUGMENTATION PARAMETERS
    use_data_augmentation: false

    augmentation_prob: 0.5       # Apply augmentation to 50% of batches
    aug_frame_prob: 0.1          # Drop 10% of frames
    aug_span_prob: 0.1           # Mask 10% of spans
    aug_channel_prob: 0.05       # Drop 5% of feature channels
    


lightning:
  callback:
    learning_rate_logger:
      target: pytorch_lightning.callbacks.LearningRateMonitor
      params:
        logging_interval: step
  trainer:
    #strategy: ddp_find_unused_parameters_true
    accumulate_grad_batches: 2
    accelerator: gpu
    devices: 1
    max_epochs: 150
    gradient_clip_val: 1.0
    check_val_every_n_epoch: 2
    precision: bf16

data:
  target: dataset.datamodule.DataModuleFromConfig
  params:
    batch_size: 16
    num_workers: 2
  
    train:
      target: dataset.p14t.Phoenix14T
      params:
        anno_root: ./preprocess/Phoenix14T
        vid_root: ./dataset/Phoenix14T
        feat_root: /home/omar_bishr/spamo_workspace/phoenix/feat_Phoenix14T
        mae_feat_root: /home/omar_bishr/spamo_workspace/phoenix/mae_feat_Phoenix14T
        pose_root: /home/omar_bishr/spamo_workspace/phoenix/pose_Phoenix14T
        mode: train
        spatial: true
        spatiotemporal: true
        pose: false
        spatial_postfix: ""
        spatiotemporal_postfix: ""
        pose_postfix: ""
        
    validation:
      target: dataset.p14t.Phoenix14T
      params:
        anno_root: ./preprocess/Phoenix14T
        vid_root: ./dataset/Phoenix14T
        feat_root: /home/omar_bishr/spamo_workspace/phoenix/feat_Phoenix14T
        mae_feat_root: /home/omar_bishr/spamo_workspace/phoenix/mae_feat_Phoenix14T
        pose_root: /home/omar_bishr/spamo_workspace/phoenix/pose_Phoenix14T
        mode: dev
        spatial: true
        spatiotemporal: true
        pose: false
        spatial_postfix: ""
        spatiotemporal_postfix: ""
        pose_postfix: ""
    
    test:
      target: dataset.p14t.Phoenix14T
      params:
        anno_root: ./preprocess/Phoenix14T
        vid_root: ./dataset/Phoenix14T
        feat_root: /home/omar_bishr/spamo_workspace/phoenix/feat_Phoenix14T
        mae_feat_root: /home/omar_bishr/spamo_workspace/phoenix/mae_feat_Phoenix14T
        pose_root: /home/omar_bishr/spamo_workspace/phoenix/pose_Phoenix14T
        mode: test
        spatial: true
        spatiotemporal: true
        pose: false
        spatial_postfix: ""
        spatiotemporal_postfix: ""
        pose_postfix: ""
