model:
  target: spamo.t5_slt.FlanT5SLT
  params:
    lr: 6.0e-4
    monitor: val/bleu4

    model_name: google/flan-t5-small
    cache_dir: /data3/models

    inter_hidden: 512
    input_size: 2048
    beam_size: 5
    max_frame_len: 512
    max_txt_len: 128
    frame_sample_rate: 1
    prompt: "Translate the given sentence into {}."

    tuning_type: lora

    # Reduce model capacity
    lora_r: 64
    lora_alpha: 128

    # Increase regularization
    lora_dropout: 0.05
    weight_decay: 0.0

    fusion_mode: joint
    warm_up_steps: 600
    cross_modal_align: true
    combined_loss: true

    alpha: 1.0

    sign_cl_loss: true
    sign_cl_alpha: 0.1
    sign_cl_temperature: 0.3
    sign_cl_temporal_window: 12
    sign_cl_every_n_steps: 1

    use_in_context: false
    num_in_context: 0
    # NEW AUGMENTATION PARAMETERS
    use_data_augmentation: false

    augmentation_prob: 0.5       # Apply augmentation to 50% of batches
    aug_frame_prob: 0.1          # Drop 10% of frames
    aug_span_prob: 0.1           # Mask 10% of spans
    aug_channel_prob: 0.05       # Drop 5% of feature channels
    # # Stronger augmentation
    # use_data_augmentation: true
    # augmentation_prob: 0.7
    # aug_frame_prob: 0.15
    # aug_span_prob: 0.2
    # aug_channel_prob: 0.1

lightning:
  callback:
    learning_rate_logger:
      target: pytorch_lightning.callbacks.LearningRateMonitor
      params:
        logging_interval: step
  trainer:
    strategy: ddp_find_unused_parameters_true
    accumulate_grad_batches: 4
    accelerator: gpu
    devices: 2
    max_epochs: 200
    gradient_clip_val: 1.0
    check_val_every_n_epoch: 1
    precision: bf16

data:
  target: dataset.datamodule.DataModuleFromConfig
  params:
    batch_size: 8
    num_workers: 4
  
    train:
      target: dataset.p14t.Phoenix14T
      params:
        anno_root: ./preprocess/Phoenix14T
        vid_root: ./dataset/Phoenix14T
        feat_root: feat_Phoenix14T
        mae_feat_root: mae_feat_Phoenix14T
        pose_root: pose_Phoenix14T
        mode: train
        spatial: true
        spatiotemporal: true
        pose: true
        spatial_postfix: ""
        spatiotemporal_postfix: ""
        pose_postfix: ""
        
    validation:
      target: dataset.p14t.Phoenix14T
      params:
        anno_root: ./preprocess/Phoenix14T
        vid_root: ./dataset/Phoenix14T
        feat_root: feat_Phoenix14T
        mae_feat_root: mae_feat_Phoenix14T
        pose_root: pose_Phoenix14T
        mode: test
        spatial: true
        spatiotemporal: true
        pose: true
        spatial_postfix: ""
        spatiotemporal_postfix: ""
        pose_postfix: ""
    
    test:
      target: dataset.p14t.Phoenix14T
      params:
        anno_root: ./preprocess/Phoenix14T
        vid_root: ./dataset/Phoenix14T
        feat_root: feat_Phoenix14T
        mae_feat_root: mae_feat_Phoenix14T
        pose_root: pose_Phoenix14T
        mode: test
        spatial: true
        spatiotemporal: true
        pose: true
        spatial_postfix: ""
        spatiotemporal_postfix: ""
        pose_postfix: ""
