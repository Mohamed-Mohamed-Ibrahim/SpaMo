model:
  target: spamo.t5_slt.FlanT5SLT
  params:
    lr: 3.0e-4
    monitor: val/bleu4

    model_name: MBZUAI/LaMini-Flan-T5-783M
    cache_dir: /data3/models

    inter_hidden: 1024
    input_size: 2048
    beam_size: 5
    max_frame_len: 512
    max_txt_len: 128
    frame_sample_rate: 1
    prompt: "Translate the given sentence into {}."

    tuning_type: lora

    use_spatial: true
    use_spatiotemporal: true
    use_pose: false

    # Reduce model capacity
    lora_r: 32
    lora_alpha: 64

    # Increase regularization
    lora_dropout: 0.05
    weight_decay: 0.05

    fusion_mode: joint
    warm_up_steps: 1000
    cross_modal_align: true
    combined_loss: true

    alpha: 1.0

    sign_cl_loss: false
    sign_cl_alpha: 0.1
    sign_cl_temperature: 0.3
    sign_cl_temporal_window: 4
    sign_cl_every_n_steps: 1

    use_kt_loss: false
    kt_lambda: 1.3

    use_in_context: false
    num_in_context: 0
    # NEW AUGMENTATION PARAMETERS
    use_data_augmentation: false
    augmentation_prob: 0.1      # Apply augmentation to 50% of batches
    aug_frame_prob: 0.05          # Drop 10% of frames
    aug_span_prob: 0.05           # Mask 10% of spans
    aug_channel_prob: 0.05      # Drop 5% of feature channels


    conv_type: 2
    use_ctc: true        # master on/off switch
    ctc_weight: 0.5      # λ_Txt — weight of L_TxtCTC in total loss
    ctc_blank_id: -1     # -1 means auto-resolve from tokenizer.pad_token_id


    use_hyperbolic: true
    hyp_dim: 128            # embedding dim on the Poincaré ball
    hyp_init_c: 1.0         # initial curvature (learnable); set 0.001 for near-Euclidean ablation
    hyp_alpha: 0.5          # weight of hyp loss in final loss sum
 

    # InfoLOOB loss for visual-textual alignment
    use_infoloob_loss: false
    infoloob_temperature: 0.03
    infoloob_weight: 1.0

    # Dynamic Temporal Segmentation and Masking
    use_dynamic_segmentation: false
    motion_threshold: 0.8
    use_adaptive_masking: false
    mask_prob: 0.15
    min_mask_len: 5
    max_mask_len: 20
    # NEW: Enhanced Segmentation Parameters
    num_layers: 3                # Depth of motion detection network (2-5 recommended)
    mask_type: 'noise'           # Masking strategy: 'noise', 'smooth', or 'zero'

lightning:
  callback:
    learning_rate_logger:
      target: pytorch_lightning.callbacks.LearningRateMonitor
      params:
        logging_interval: step
  trainer:
    strategy: ddp_find_unused_parameters_true
    accumulate_grad_batches: 4
    accelerator: gpu
    devices: 2
    max_epochs: 200
    gradient_clip_val: 1.0
    check_val_every_n_epoch: 1
    precision: bf16

data:
  target: dataset.datamodule.DataModuleFromConfig
  params:
    batch_size: 8
    num_workers: 4
  
    train:
      target: dataset.p14t.Phoenix14T
      params:
        anno_root: ./preprocess/Phoenix14T
        vid_root: ./dataset/Phoenix14T
        feat_root: feat_Phoenix14T
        mae_feat_root: mae_feat_Phoenix14T
        pose_root: pose_Phoenix14T
        mode: train
        spatial: true
        spatiotemporal: true
        pose: True
        spatial_postfix: ""
        spatiotemporal_postfix: ""
        pose_postfix: ""
        
    validation:
      target: dataset.p14t.Phoenix14T
      params:
        anno_root: ./preprocess/Phoenix14T
        vid_root: ./dataset/Phoenix14T
        feat_root: feat_Phoenix14T
        mae_feat_root: mae_feat_Phoenix14T
        pose_root: pose_Phoenix14T
        mode: dev
        spatial: true
        spatiotemporal: true
        pose: True
        spatial_postfix: ""
        spatiotemporal_postfix: ""
        pose_postfix: ""
    
    test:
      target: dataset.p14t.Phoenix14T
      params:
        anno_root: ./preprocess/Phoenix14T
        vid_root: ./dataset/Phoenix14T
        feat_root: feat_Phoenix14T
        mae_feat_root: mae_feat_Phoenix14T
        pose_root: pose_Phoenix14T
        mode: test
        spatial: true
        spatiotemporal: true
        pose: True
        spatial_postfix: ""
        spatiotemporal_postfix: ""
        pose_postfix: ""


