        mae_feat_root: /home/omar_bishr/spamo_workspace/phoenix/mae_feat_Phoenix14T
        pose_root: ""
        emo_feat_root: /home/omar_bishr/spamo_workspace/phoenix/emotion_features
        mode: dev
        spatial: true
