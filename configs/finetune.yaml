model:
  target: spamo.t5_slt.FlanT5SLT
  
  params:     
    lr: 6.0e-4
    monitor: val/bleu4
    model_name: google/flan-t5-small
    cache_dir: /data3/models
    inter_hidden: 512
    input_size: 1024
    beam_size: 5
    max_frame_len: 512
    max_txt_len: 64
    frame_sample_rate: 1
    prompt: "Translate the given sentence into {}."
    tuning_type: lora
    lora_r: 64
    lora_alpha: 128
    lora_dropout: 0.1
    fusion_mode: joint
    warm_up_steps: 0
    cross_modal_align: true
    combined_loss: true
    alpha: 1.0
    use_in_context: false
    num_in_context: 0

lightning:
  callback:
    learning_rate_logger:
      target: pytorch_lightning.callbacks.LearningRateMonitor
      params:
        logging_interval: step
  trainer:
    strategy: ddp_find_unused_parameters_true
    accumulate_grad_batches: 2
    accelerator: gpu
    devices: 2
    max_epochs: 10
    gradient_clip_val: 1.0
    check_val_every_n_epoch: 2
    precision: bf16

data:
  target: dataset.datamodule.DataModuleFromConfig
  params:
    batch_size: 8
    num_workers: 4
  
    train:
      target: dataset.how2sign.How2Sign
      params:
        anno_root: ./preprocess/How2Sign/test_info.npy
        vid_root: /kaggle/input/datasets/guangwoen/how2sign-clips/testing/testing/test_clips_raw_videos
        feat_root: /kaggle/input/how2sign-features/how2sign_output_test_spatial_features/kaggle/working/clip-vit-large-patch14_feat_How2Sign/test
        mae_feat_root: /kaggle/input/how2sign-features/how2sign_motion_features/kaggle/working/how2sign_motion_features/mae_feat_How2Sign/test
        mode: train
        spatial: true
        spatiotemporal: true
        spatial_postfix: ""
        spatiotemporal_postfix: "_overlap-8"
        
    validation:
      target: dataset.how2sign.How2Sign
      params:
        anno_root: ./preprocess/How2Sign/test_info.npy
        vid_root: /kaggle/input/datasets/guangwoen/how2sign-clips/testing/testing/test_clips_raw_videos
        feat_root: /kaggle/input/how2sign-features/how2sign_output_test_spatial_features/kaggle/working/clip-vit-large-patch14_feat_How2Sign/test
        mae_feat_root: /kaggle/input/how2sign-features/how2sign_motion_features/kaggle/working/how2sign_motion_features/mae_feat_How2Sign/test
        mode: test
        spatial: true
        spatiotemporal: true
        spatial_postfix: ""
        spatiotemporal_postfix: "_overlap-8"
    
    test:
      target: dataset.how2sign.How2Sign
      params:
        anno_root: ./preprocess/How2Sign/test_info.npy
        vid_root: /kaggle/input/datasets/guangwoen/how2sign-clips/testing/testing/test_clips_raw_videos
        feat_root: /kaggle/input/how2sign-features/how2sign_output_test_spatial_features/kaggle/working/clip-vit-large-patch14_feat_How2Sign/test
        mae_feat_root: /kaggle/input/how2sign-features/how2sign_motion_features/kaggle/working/how2sign_motion_features/mae_feat_How2Sign/test
        mode: test
        spatial: true
        spatiotemporal: true
        spatial_postfix: ""
        spatiotemporal_postfix: "_overlap-8"