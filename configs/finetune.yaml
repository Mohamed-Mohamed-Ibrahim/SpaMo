model:
  target: spamo.t5_slt.FlanT5SLT
  params:
    lr: 3.0e-4
    weight_decay: 0.05
    monitor: val/bleu4
    model_name: MBZUAI/LaMini-Flan-T5-783M
    cache_dir: /data3/models
    inter_hidden: 768
    input_size: 2048
    beam_size: 5
    max_frame_len: 512
    max_txt_len: 64
    frame_sample_rate: 1
    prompt: "Translate the given sentence into {}."
    tuning_type: lora
    lora_r: 32
    lora_alpha: 64
    lora_dropout: 0.05
    fusion_mode: joint
    warm_up_steps: 1000
    cross_modal_align: true
    combined_loss: true
    alpha: 1.0
    use_in_context: false
    num_in_context: 0

    sign_cl_loss: false
    sign_cl_alpha: 0.1
    sign_cl_temperature: 0.3
    sign_cl_temporal_window: 12
    sign_cl_every_n_steps: 1

    use_data_augmentation: false
    augmentation_prob: 0.5       # Apply augmentation to 50% of batches
    aug_frame_prob: 0.1          # Drop 10% of frames
    aug_span_prob: 0.1           # Mask 10% of spans
    aug_channel_prob: 0.05       # Drop 5% of feature channels
    # # Stronger augmentation
    # use_data_augmentation: true
    # augmentation_prob: 0.7
    # aug_frame_prob: 0.15
    # aug_span_prob: 0.2
    # aug_channel_prob: 0.1

    use_temporal_conv: true

    use_second_encoder: false

    # ── Option A: Deformable Transformer (local+global deformable attention) ─
    encoder_cfg:
      type: deformable_transformer
      hidden_size: 768          # must match inter_hidden
      num_layers: 2
      num_heads: 8
      ff_size: 2048
      dropout: 0.1
      query_type: mean          # 'mean' | 'attention'
      query_nb: 3
      num_keys: [5, 5]          # one entry per num_layers
      attentions_type: weighted_local_global   # 'weighted_local_global' | 'local' | 'global'

    # ── Option B: Standard Transformer ───────────────────────────────────────
    # encoder_cfg:
    #   type: transformer
    #   hidden_size: 768
    #   num_layers: 2
    #   num_heads: 8
    #   ff_size: 2048
    #   dropout: 0.1

    # ── Option C: Recurrent (GRU / LSTM) ─────────────────────────────────────
    # encoder_cfg:
    #   type: recurrent
    #   hidden_size: 384          # output will be 2*hidden_size if bidirectional
    #   rnn_type: gru             # 'gru' | 'lstm'
    #   num_layers: 1
    #   dropout: 0.1
    #   bidirectional: true

lightning:
  callback:
    learning_rate_logger:
      target: pytorch_lightning.callbacks.LearningRateMonitor
      params:
        logging_interval: step
  trainer:
    strategy: ddp_find_unused_parameters_true
    accumulate_grad_batches: 4
    accelerator: gpu
    devices: 2
    max_epochs: 2
    gradient_clip_val: 1.0
    check_val_every_n_epoch: 1
    precision: bf16

data:
  target: dataset.datamodule.DataModuleFromConfig
  params:
    batch_size: 8
    num_workers: 4
  
    train:
      target: dataset.p14t.Phoenix14T
      params:
        anno_root: ./preprocess/Phoenix14T
        vid_root: ./dataset/Phoenix14T
        feat_root: feat_Phoenix14T
        mae_feat_root: mae_feat_Phoenix14T
        pose_root: pose_Phoenix14T
        mode: train
        spatial: true
        spatiotemporal: true
        pose: false
        spatial_postfix: ""
        spatiotemporal_postfix: ""
        pose_postfix: ""
        
    validation:
      target: dataset.p14t.Phoenix14T
      params:
        anno_root: ./preprocess/Phoenix14T
        vid_root: ./dataset/Phoenix14T
        feat_root: feat_Phoenix14T
        mae_feat_root: mae_feat_Phoenix14T
        pose_root: pose_Phoenix14T
        mode: dev
        spatial: true
        spatiotemporal: true
        pose: false
        spatial_postfix: ""
        spatiotemporal_postfix: ""
        pose_postfix: ""
    
    test:
      target: dataset.p14t.Phoenix14T
      params:
        anno_root: ./preprocess/Phoenix14T
        vid_root: ./dataset/Phoenix14T
        feat_root: feat_Phoenix14T
        mae_feat_root: mae_feat_Phoenix14T
        pose_root: pose_Phoenix14T
        mode: test
        spatial: true
        spatiotemporal: true
        pose: false
        spatial_postfix: ""
        spatiotemporal_postfix: ""
        pose_postfix: ""
