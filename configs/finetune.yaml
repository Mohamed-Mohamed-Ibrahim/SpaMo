model:
  target: spamo.t5_slt.FlanT5SLT
  params:
    lr: 3.0e-4
    monitor: val/bleu4

    model_name: google/flan-t5-large
    cache_dir: /data3/models

    inter_hidden: 1024
    input_size: 2048
    gfslt_dim: 1024        # <--- Explicit dimension for GFSLT
    beam_size: 5
    max_frame_len: 512
    max_txt_len: 128
    frame_sample_rate: 1
    prompt: "Translate the given sentence into {}."

    tuning_type: lora

    # --- MASTER TOGGLES FOR THE MODEL ---
    # Change these to true/false to experiment with different combinations
    use_spatial: true
    use_spatiotemporal: true
    use_pose: false
    use_gfslt: true

    # Reduce model capacity
    lora_r: 32
    lora_alpha: 64

    # Increase regularization
    lora_dropout: 0.05
    weight_decay: 0.05

    fusion_mode: joint
    warm_up_steps: 1000
    cross_modal_align: true
    combined_loss: true

    alpha: 1.0

    sign_cl_loss: false
    sign_cl_alpha: 0.1
    sign_cl_temperature: 0.3
    sign_cl_temporal_window: 12
    sign_cl_every_n_steps: 1

    use_in_context: false
    num_in_context: 0
    
    use_data_augmentation: false
    augmentation_prob: 0.5       
    aug_frame_prob: 0.1          
    aug_span_prob: 0.1           
    aug_channel_prob: 0.05       

lightning:
  callback:
    learning_rate_logger:
      target: pytorch_lightning.callbacks.LearningRateMonitor
      params:
        logging_interval: step
  trainer:
    strategy: ddp
    accumulate_grad_batches: 4
    accelerator: gpu
    devices: 2
    max_epochs: 200
    gradient_clip_val: 1.0
    check_val_every_n_epoch: 1
    precision: 32

data:
  target: dataset.datamodule.DataModuleFromConfig
  params:
    batch_size: 8
    num_workers: 4
  
    train:
      target: dataset.p14t.Phoenix14T
      params:
        anno_root: ./preprocess/Phoenix14T
        
        # --- ALL FEATURE DIRECTORIES ---
        vid_root: ./dataset/Phoenix14T
        feat_root: feat_Phoenix14T                                                                       # Spatial
        mae_feat_root: mae_feat_Phoenix14T                                                               # Spatiotemporal
        pose_root: pose_Phoenix14T                                                                       # Pose
        gfslt_root: /kaggle/input/datasets/muhammad5286/phoenix14t-gfslt-1/Phoenix14T-GFSLT-1/train      # GFSLT
        
        mode: train
        
        # --- MASTER TOGGLES FOR THE DATASET ---
        # Make sure these match the model toggles above!
        spatial: true
        spatiotemporal: true
        pose: false
        gfslt: true
        
        spatial_postfix: ""
        spatiotemporal_postfix: ""
        pose_postfix: ""
        gfslt_postfix: ""
        
    validation:
      target: dataset.p14t.Phoenix14T
      params:
        anno_root: ./preprocess/Phoenix14T
        vid_root: ./dataset/Phoenix14T
        feat_root: feat_Phoenix14T
        mae_feat_root: mae_feat_Phoenix14T
        pose_root: pose_Phoenix14T
        gfslt_root: /kaggle/input/datasets/muhammad5286/phoenix14t-gfslt-1/Phoenix14T-GFSLT-1/dev
        
        mode: dev
        spatial: true
        spatiotemporal: true
        pose: false
        gfslt: true
        
        spatial_postfix: ""
        spatiotemporal_postfix: ""
        pose_postfix: ""
        gfslt_postfix: ""
    
    test:
      target: dataset.p14t.Phoenix14T
      params:
        anno_root: ./preprocess/Phoenix14T
        vid_root: ./dataset/Phoenix14T
        feat_root: feat_Phoenix14T
        mae_feat_root: mae_feat_Phoenix14T
        pose_root: pose_Phoenix14T
        gfslt_root: /kaggle/input/datasets/muhammad5286/phoenix14t-gfslt-1/Phoenix14T-GFSLT-1/test
        
        mode: test
        spatial: true
        spatiotemporal: true
        pose: false
        gfslt: true
        
        spatial_postfix: ""
        spatiotemporal_postfix: ""
        pose_postfix: ""
        gfslt_postfix: ""